<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dummy 13 — Calibration</title>
<style>
 body{margin:0;background:#101418;color:#e8edf4;font:17px/1.5 -apple-system,system-ui,sans-serif}
 .wrap{max-width:560px;margin:0 auto;padding:16px}
 h1{font-size:22px} h2{font-size:19px;margin:8px 0}
 .card{background:#1a2129;border:1px solid #2b3542;border-radius:14px;padding:16px;margin:14px 0}
 .ok{color:#7ee08a}.bad{color:#ff7d7d}.warn{color:#ffd479}
 button{font-size:18px;padding:12px 18px;border-radius:12px;border:0;background:#2c6df2;color:#fff;margin:4px;cursor:pointer}
 button.big{font-size:22px;padding:16px 26px;width:100%}
 button.gray{background:#33404f} button.red{background:#d64545} button.green{background:#2e9e53}
 .steps{display:flex;gap:6px;margin:10px 0}
 .dot{flex:1;height:8px;border-radius:4px;background:#2b3542}.dot.on{background:#2c6df2}
 .joint{display:flex;align-items:center;justify-content:space-between;background:#141a21;border-radius:10px;padding:8px 12px;margin:6px 0}
 .hint{background:#22303f;border-left:4px solid #2c6df2;padding:10px 12px;border-radius:8px;margin:10px 0}
 .danger{background:#3a2226;border-left:4px solid #d64545;padding:10px 12px;border-radius:8px;margin:10px 0}
 #log{font:13px monospace;color:#9fb0c3;white-space:pre-wrap;max-height:110px;overflow:auto}
</style>
</head>
<body><div class="wrap">
<h1>🤖 Dummy 13 — Get it ready to run</h1>
<div class="steps" id="dots"></div>
<div id="page"></div>
<div class="card"><b>Robot link:</b> <span id="link" class="bad">connecting…</span><div id="log"></div></div>
<script>
const JOINTS = ["hip_pitch_l", "hip_roll_l", "knee_l", "ankle_pitch_l", "ankle_roll_l", "hip_pitch_r", "hip_roll_r", "knee_r", "ankle_pitch_r", "ankle_roll_r", "spine_pitch", "shoulder_pitch_l", "shoulder_roll_l", "elbow_l", "shoulder_pitch_r", "shoulder_roll_r", "elbow_r", "hip_yaw_l", "hip_yaw_r"];
// GENERATED from the sim: joint order == firmware order == policy order.
let ws=null, id=1, pend={}, step=0;
const HOST = location.hostname || "dummy13.local";
function log(m){const e=document.getElementById('log');e.textContent=(m+"\n"+e.textContent).slice(0,2000);}
function send(cmd, args={}){return new Promise(res=>{const m={id:id++,cmd,...args};pend[m.id]=res;ws.send(JSON.stringify(m));setTimeout(()=>{if(pend[m.id]){delete pend[m.id];res(null);}},4000);});}
function connect(){
  ws=new WebSocket("ws://"+HOST+":8766");
  ws.onopen=()=>{document.getElementById('link').textContent="connected to "+HOST;document.getElementById('link').className="ok";};
  ws.onclose=()=>{document.getElementById('link').textContent="reconnecting…";document.getElementById('link').className="bad";setTimeout(connect,1500);};
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pend[m.id]){pend[m.id](m);delete pend[m.id];}else if(m.event){log("event: "+m.event);}};
}
connect();

const PAGES = [
{title:"Welcome", html:`
 <div class="card"><h2>Step 1 · Before we start</h2>
 <p>This wizard gets your freshly-built robot ready to walk. It talks to the robot
 directly — no app, no account. It takes about 15 minutes.</p>
 <div class="danger"><b>Robot on its STAND or lying on its back for all steps until the
 very last one.</b> Feet off the ground = nothing can go wrong.</div>
 <div class="hint">Battery charged? Both PCA9685 lights on? Then press GO.</div>
 <button class="big" onclick="next()">GO ▶</button></div>`},
{title:"Servo centers", html:`
 <div class="card"><h2>Step 2 · Point every servo the right way</h2>
 <p>We'll go joint by joint. For each one, use the buttons until the limb matches the
 <b>build-guide picture for the STAND pose</b> (legs straight down, feet flat, arms at
 the sides, elbows slightly bent).</p>
 <div class="hint">Small button = fine nudge. Big button = coarse. It moves LIVE.</div>
 <div id="jlist"></div>
 <button class="big green" onclick="next()">All limbs match the picture ▶</button></div>`},
{title:"Joint sensors", html:`
 <div class="card"><h2>Step 3 · Teach it to feel its joints</h2>
 <p>Two automatic poses. Keep hands clear; it will move by itself, slowly.</p>
 <button class="big" id="potbtn" onclick="potCal()">Start automatic sensor calibration</button>
 <div id="potstat"></div></div>`},
{title:"Balance sensor", html:`
 <div class="card"><h2>Step 4 · Check its sense of balance</h2>
 <p>Hold the robot <b>upright</b> — the ball should sit in the middle. Tilt it — the
 ball should follow. If it moves the WRONG way, the IMU is mounted backwards
 (see build guide, Chapter 8).</p>
 <canvas id="bubble" width="220" height="220" style="display:block;margin:10px auto;background:#141a21;border-radius:50%"></canvas>
 <button class="big green" onclick="next()">The ball follows my tilt ▶</button></div>`},
{title:"Save", html:`
 <div class="card"><h2>Step 5 · Save forever</h2>
 <p>This writes your calibration into the robot's permanent memory. It survives
 power-off. You only ever redo this if you replace a servo.</p>
 <button class="big" onclick="doSave()">SAVE CALIBRATION 💾</button>
 <div id="savestat"></div></div>`},
{title:"First stand", html:`
 <div class="card"><h2>Step 6 · First stand!</h2>
 <div class="danger">Put the robot on a <b>flat floor with 50cm clear space around it</b>,
 standing on its feet, and hold it lightly by the shoulders.</div>
 <button class="big green" onclick="doArm()">ARM — let it balance</button>
 <button class="big red" onclick="doDisarm()">DISARM (relax)</button>
 <div id="armstat"></div>
 <div class="hint" id="afterarm" style="display:none">It's holding its own weight!
 Let go gently. If it stays up: <b>your robot is alive.</b></div></div>`},
{title:"Done", html:`
 <div class="card"><h2>🎉 It's ready.</h2>
 <p>Calibration done and saved. From here on:</p>
 <p><a style="color:#7db4ff;font-size:20px" href="http://localhost:8000/index.html">▶ Open the robot's live 3D view + command site</a><br>
 <small>(the brain website — run it from your computer; point it at ws://${HOST})</small></p>
 <p>Try, in order: <b>stop → walk → stop</b>. Its first steps are yours to watch.</p></div>`},
];

function dots(){document.getElementById('dots').innerHTML=PAGES.map((_,i)=>`<div class="dot ${i<=step?'on':''}"></div>`).join('');}
function render(){dots();document.getElementById('page').innerHTML=PAGES[step].html;
  if(step===1){buildJointList();} if(step===3){bubbleLoop();}}
function next(){step=Math.min(step+1,PAGES.length-1);render();}
function buildJointList(){
  document.getElementById('jlist').innerHTML=JOINTS.map((n,j)=>`
   <div class="joint"><span>${j}. ${n}</span><span>
    <button class="gray" onclick="nudge(${j},-25)">◀◀</button>
    <button class="gray" onclick="nudge(${j},-6)">◀</button>
    <button class="gray" onclick="nudge(${j},6)">▶</button>
    <button class="gray" onclick="nudge(${j},25)">▶▶</button></span></div>`).join('');
}
async function nudge(j,us){const r=await send("cal_servo",{joint:j,nudge:us});if(r&&r.ok)log(`servo ${j} center ${r.detail.us}us`);}
async function potCal(){
  const st=document.getElementById('potstat');
  st.innerHTML="<p class='warn'>Pose A (zero)…</p>";
  await send("cal_pose",{pose:"zero"}); await new Promise(r=>setTimeout(r,2500));
  const A=await send("cal_read");
  st.innerHTML="<p class='warn'>Pose B (stand)…</p>";
  await send("cal_pose",{pose:"stand"}); await new Promise(r=>setTimeout(r,2500));
  const B=await send("cal_read");
  if(!A||!B){st.innerHTML="<p class='bad'>Robot didn't answer — check the link and retry.</p>";return;}
  // two-point fit per joint: angle = raw*scale + off  (angles known: 0 and Q_STAND — the
  // firmware knows Q_STAND; we send the fit assuming stand angles reported by config)
  let bad=[];
  for(let j=0;j<JOINTS.length;j++){
    const ra=A.detail.pot_raw[j], rb=B.detail.pot_raw[j];
    if(Math.abs(ra-rb)<8){bad.push(JOINTS[j]);continue;}   // sensor not responding
    const qb=STAND[j];                                     // rad, injected below
    const scale=(qb-0)/(rb-ra), off=-scale*ra;
    await send("cal_pot",{joint:j,scale:scale,off:off});
  }
  st.innerHTML=bad.length?`<p class='bad'>These joints' sensors didn't move: ${bad.join(", ")}.
   Check their pot wires (build guide Ch.8), then run this step again.</p>`
   :"<p class='ok'>All 19 joint sensors calibrated ✓</p><button class='big green' onclick='next()'>Continue ▶</button>";
}
async function bubbleLoop(){
  const c=document.getElementById('bubble'); if(!c)return;
  const g=await send("cal_read");
  if(g&&g.ok){const ctx=c.getContext('2d');ctx.clearRect(0,0,220,220);
    ctx.fillStyle="#2b3542";ctx.beginPath();ctx.arc(110,110,6,0,7);ctx.fill();
    const x=110+g.detail.grav[0]*100, y=110+g.detail.grav[1]*100;
    ctx.fillStyle="#7ee08a";ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.fill();}
  if(step===3)setTimeout(bubbleLoop,150);
}
async function doSave(){const r=await send("cal_save");document.getElementById('savestat').innerHTML=r&&r.ok?"<p class='ok'>Saved ✓</p><button class='big green' onclick='next()'>Continue ▶</button>":"<p class='bad'>Save failed — retry.</p>";}
async function doArm(){const r=await send("arm");if(r&&r.ok){document.getElementById('armstat').innerHTML="<p class='ok'>ARMED — balancing.</p>";document.getElementById('afterarm').style.display='block';setTimeout(next,20000);}}
async function doDisarm(){await send("disarm");document.getElementById('armstat').innerHTML="<p class='warn'>Relaxed.</p>";}
const STAND = [0.0698, 0.0262, -0.2094, 0.1745, 0.0, 0.0698, -0.0262, -0.2094, 0.1745, 0.0, 0.0, 0.0, 0.0, 0.5236, 0.0, 0.0, 0.5236, 0.0, 0.0];
render();
</script>
</div></body>
</html>
